name: PromptGate CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend Tests and Coverage

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python syntax
        run: |
          python -m compileall -q promptgate tests

      - name: Run automated tests and coverage
        run: |
          python -m pytest -v \
            --cov=promptgate \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: promptgate-coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
